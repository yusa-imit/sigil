name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native macOS runners could not link libSystem with Zig 0.15 on GitHub's images
  # (undefined _abort/_malloc/...). Re-verified on 0.16.0 (plan 001 item 8): the link
  # failure does not reproduce, so tests now run natively on both Linux and macOS.
  # Windows has no native job (no GitHub-hosted Windows Zig cache precedent here yet) and
  # stays covered by cross-compilation below.
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: mlugg/setup-zig@v2
      - name: Clear Zig cache
        run: rm -rf .zig-cache zig-out
      - name: Format check
        run: zig fmt --check src build.zig bench tools
      - name: Build
        run: zig build
      - name: Test
        run: zig build test

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-macos-none
          - aarch64-macos-none
          - x86_64-windows-msvc
          - aarch64-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - name: Install Zig
        uses: mlugg/setup-zig@v2
      - name: Clear Zig cache
        run: rm -rf .zig-cache zig-out
      - name: Build
        run: zig build -Dtarget=${{ matrix.target }}
